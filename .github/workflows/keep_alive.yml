name: 24/7 Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping CleanMark AI API
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive health check
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://cleanmark-ai-api.onrender.com/v1/health)
          echo "Health check HTTP status: $response"
          if [ "$response" -ne 200 ]; then
            echo "Warning: Expected HTTP 200, got $response"
          fi
